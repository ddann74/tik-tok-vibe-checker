name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests (detection F1 + API contract + storage degradation)
        run: PYTHONPATH=. pytest tests/ -v
      - name: Security scan (bandit)
        run: |
          pip install bandit
          bandit -r npl_engine -f txt
      - name: Grep for hardcoded API keys/secrets
        run: |
          if grep -RInE "(api[_-]?key|secret|token)\s*=\s*['\"][A-Za-z0-9_\-]{16,}['\"]" \
              --include="*.py" npl_engine/ scripts/; then
            echo "Possible hardcoded secret found above"; exit 1;
          fi
          echo "No hardcoded secrets found"
